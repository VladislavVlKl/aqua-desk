name: Daily Trainer Reminder

on:
  # Регулярный запуск ведёт pg_cron внутри Supabase (job daily-reminder-hourly,
  # каждый час → Edge Function daily-reminder). GitHub Actions крон отключён:
  # он пропускал часы блоками, из-за чего часовые гейты (9:00/22:00) и окна
  # опросника промахивались. Оставлен только ручной запуск как аварийный.
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase SDK
        run: npm install @supabase/supabase-js

      - name: Run reminder
        env:
          BOT_TOKEN:         ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node backend/jobs/remind.js
