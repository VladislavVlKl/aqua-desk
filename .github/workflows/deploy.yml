name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Бандл: 31 js + 4 css → dist/app-<hash>.js|css, index.html переписывается на них.
      # Скрипт сам копирует frontend/ в _site/ и валидирует бандл (node --check + глобальные
      # имена). Падение сборки = падение деплоя, прод остаётся на прошлой версии.
      # Откат к пофайловой раздаче: вернуть здесь rsync -a frontend/ _site/
      - name: Prepare site files (bundle)
        run: node scripts/build.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
