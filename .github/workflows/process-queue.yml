name: Process Notification Queue

on:
  # Регулярную доставку ведёт pg_cron внутри Supabase (job process-notif-queue,
  # раз в минуту → Edge Function process-queue). GitHub Actions крон отключён:
  # он исполнялся раз в 6–21 ч вместо 5 мин. Оставлен только ручной запуск
  # как аварийный канал (той же логикой: вайтлист «замен» + ретраи).
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase SDK
        run: npm install @supabase/supabase-js

      - name: Process queue
        env:
          BOT_TOKEN:         ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node backend/jobs/process-queue.js
